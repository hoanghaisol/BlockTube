// BlockTube: on-device "similar channels" suggester. Independent from :common;
// :common calls into it and provides engine data through interfaces.
apply from: gradle.ext.sharedModulesConstants
apply plugin: 'com.android.library'

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    compileSdkVersion project.properties.compileSdkVersion
    buildToolsVersion project.properties.buildToolsVersion

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion
        targetSdkVersion project.properties.compileSdkVersion // same as the ststable app; 27 is blocked by Play Protect
        multiDexEnabled = true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests.all {
            // Generated by tools/export_tokenizer.py, see UnigramTokenizerTest
            systemProperty 'channelfilter.vocab', "${projectDir}/build/test-assets/vocab.bin"
        }
    }
}

dependencies {
    // 1.31.x is newer than two weeks at the time of writing; bump deliberately
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    implementation 'androidx.work:work-runtime:' + workVersion

    androidTestImplementation 'androidx.test:runner:1.4.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    testImplementation 'junit:junit:' + junitVersion
    testImplementation 'com.google.code.gson:gson:' + gsonVersion
}
